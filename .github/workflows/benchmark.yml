name: Full benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Results always land on the default branch, so serialize every publication.
  group: full-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run and publish benchmark
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # A manual run can be launched while viewing another branch. Always
          # publish the canonical result and README link to the default branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run full benchmark
        id: benchmark
        shell: bash
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          result_file="benchmark-results/benchmark-${timestamp}.json"
          npm run --silent benchmark -- --format json > "$result_file"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

      - name: Validate benchmark output
        env:
          RESULT_FILE: ${{ steps.benchmark.outputs.result_file }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const results = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
          if (!Array.isArray(results) || results.length === 0) {
            throw new Error('Benchmark output must be a non-empty JSON array');
          }

          for (const result of results) {
            if (!result.router || !result.scenario || result.opsPerSecond <= 0) {
              throw new Error(`Invalid benchmark result: ${JSON.stringify(result)}`);
            }
          }
          NODE

      - name: Update latest-results link
        env:
          RESULT_FILE: ${{ steps.benchmark.outputs.result_file }}
          TIMESTAMP: ${{ steps.benchmark.outputs.timestamp }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const readmePath = 'README.md';
          const readme = fs.readFileSync(readmePath, 'utf8');
          const resultName = process.env.RESULT_FILE.split('/').pop();
          const results = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
          const dynamicResults = results.filter(({ scenario }) => scenario === 'dynamic');
          if (dynamicResults.length === 0) {
            throw new Error('Cannot build the README chart without dynamic results');
          }

          const labels = dynamicResults.map(({ router }) => JSON.stringify(router)).join(', ');
          const medians = dynamicResults.map(({ medianMs }) => medianMs).join(', ');
          const p95s = dynamicResults.map(({ p95Ms }) => p95Ms).join(', ');
          const operations = dynamicResults.map(({ opsPerSecond }) => opsPerSecond).join(', ');
          const formatNumber = new Intl.NumberFormat('en-US').format;
          const tableRows = results.map((result) => [
            `\`${result.router}\``,
            `\`${result.package}@${result.version}\``,
            `\`${result.scenario}\``,
            formatNumber(result.routes),
            formatNumber(result.runsPerSample),
            formatNumber(result.samples),
            formatNumber(result.medianMs),
            formatNumber(result.p95Ms),
            formatNumber(result.opsPerSecond),
          ].join(' | '));
          const replacement = [
            '<!-- benchmark-results:start -->',
            `Latest automated result: [\`${resultName}\`](./${process.env.RESULT_FILE}) (generated ${process.env.TIMESTAMP} UTC).`,
            '',
            'The charts show every metric captured for dynamic-route matching. Lower is better for elapsed times; higher is better for throughput.',
            '',
            '```mermaid',
            'xychart-beta',
            '    title "Dynamic route median elapsed time"',
            `    x-axis [${labels}]`,
            '    y-axis "Milliseconds per sample"',
            `    bar [${medians}]`,
            '```',
            '',
            '```mermaid',
            'xychart-beta',
            '    title "Dynamic route p95 elapsed time"',
            `    x-axis [${labels}]`,
            '    y-axis "Milliseconds per sample"',
            `    bar [${p95s}]`,
            '```',
            '',
            '```mermaid',
            'xychart-beta',
            '    title "Dynamic route matching throughput"',
            `    x-axis [${labels}]`,
            '    y-axis "Operations per second"',
            `    bar [${operations}]`,
            '```',
            '',
            '### Complete results',
            '',
            'All captured metrics are shown below. Times are for one complete sample of the configured number of runs.',
            '',
            '| Router | Package version | Scenario | Routes | Runs / sample | Samples | Median (ms) | p95 (ms) | Operations / second |',
            '| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            ...tableRows.map((row) => `| ${row} |`),
            '<!-- benchmark-results:end -->',
          ].join('\n');
          const updated = readme.replace(
            /<!-- benchmark-results:start -->[\s\S]*?<!-- benchmark-results:end -->/,
            replacement,
          );

          if (updated === readme) {
            throw new Error('Could not find the benchmark results markers in README.md');
          }
          fs.writeFileSync(readmePath, updated);
          NODE

      - name: Commit benchmark result
        env:
          COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          COMMITTER_NAME: ${{ github.actor }}
          RESULT_FILE: ${{ steps.benchmark.outputs.result_file }}
        run: |
          git config user.name "$COMMITTER_NAME"
          git config user.email "$COMMITTER_EMAIL"
          git add README.md "$RESULT_FILE"
          git commit -m "Add benchmark results from $(basename "$RESULT_FILE" .json)"
          git push
